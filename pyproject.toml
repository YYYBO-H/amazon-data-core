[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-data-core"
version = "0.4.0"
description = "A trustworthy operational data foundation for Amazon sellers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LGURT" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
agent = ["mcp>=1.12,<2"]

[project.scripts]
amazon-data-core = "amazon_data_core.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
amazon_data_core = ["schema.sql", "resources/**/*.md"]
