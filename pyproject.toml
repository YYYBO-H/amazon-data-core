[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-data-core"
version = "0.5.0"
description = "Open-source, local-first Amazon seller data foundation with verified read-only MCP access"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "LGURT" }]
keywords = [
  "amazon-sp-api",
  "amazon-seller",
  "local-first",
  "mcp-server",
  "data-quality",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: Database",
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
agent = ["mcp>=1.12,<2"]

[project.scripts]
amazon-data-core = "amazon_data_core.cli:main"

[project.urls]
Homepage = "https://github.com/YYYBO-H/amazon-data-core"
Repository = "https://github.com/YYYBO-H/amazon-data-core"
Documentation = "https://github.com/YYYBO-H/amazon-data-core/tree/main/docs"
Issues = "https://github.com/YYYBO-H/amazon-data-core/issues"
Changelog = "https://github.com/YYYBO-H/amazon-data-core/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
amazon_data_core = ["schema.sql", "resources/**/*.md"]
